name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-pc-windows-gnu
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu --features=manifest-4932913164832566208
      - uses: actions/upload-artifact@v4
        with:
          name: omdu_hook
          path: target/x86_64-pc-windows-gnu/release/omdu_hook.dll
